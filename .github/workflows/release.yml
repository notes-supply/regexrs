name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First release only, before crates.io supports trusted publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-io-regexrs
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: --locked
          cache: false
      - name: Check release identity
        id: version
        env:
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          version=$(mise exec -- cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "regexrs") | .version')
          if [[ "$BOOTSTRAP" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main && "$version" == 0.1.0 ]]
          else
            [[ "$GITHUB_REF" == "refs/tags/v$version" ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: mise run check
      - run: mise run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: target/package/regexrs-*.crate
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: --locked rust
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
          path: work/verified
      - name: Verify promotion and registry state
        id: registry
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mise exec -- cargo package --locked --all-features --no-verify
          candidate="target/package/regexrs-$VERSION.crate"
          cmp "work/verified/regexrs-$VERSION.crate" "$candidate"
          code=$(curl --silent --show-error --retry 3 --max-time 30 --user-agent 'regexrs-release (https://github.com/notes-supply/regexrs)' --output work/registry.json --write-out '%{http_code}' "https://crates.io/api/v1/crates/regexrs/$VERSION")
          case "$code" in
            200)
              [[ "$(jq -r '.version.checksum' work/registry.json)" == "$(sha256sum "$candidate" | cut -d ' ' -f1)" ]]
              echo 'published=true' >> "$GITHUB_OUTPUT"
              ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io status: $code" >&2; exit 1 ;;
          esac
      - name: Authenticate with crates.io
        if: ${{ !inputs.bootstrap }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish verified package
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.bootstrap && secrets.CRATES_IO_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          mise run publish
