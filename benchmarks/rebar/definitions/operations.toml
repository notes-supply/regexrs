analysis = "Literal and capture replacements plus failed-short-run scans. Replacement bytes are verified before timing."

[[bench]]
name = "names-tiny"
model = "replace"
regex = 'Holmes|Watson'
unicode = true
haystack = { path = "synthetic/acceptance-names-tiny.txt" }
count = 23
engines = ["regexrs", "regexrs-regular", "regexrs-seek", "regex", "fancy", "fancy-seek"]

