# Captured records.
[[bench]]
model = "count-captures"
name = "log-times"
regex = '(\d{2}):(\d{2}):(\d{2})'
unicode = true
haystack = { path = "rebar/wild/unstructured-to-json.log" }
count = 400
engines = ["regexrs", "regexrs-searcher", "regexrs-regular", "regex"]

[[bench]]
model = "grep-captures"
name = "log-records"
regex = '^(\d{4}/\d{2}/\d{2}) (\d{2}:\d{2}:\d{2}) (\w+):'
unicode = true
haystack = { path = "rebar/wild/unstructured-to-json.log" }
count = 400
engines = ["regexrs", "regexrs-searcher", "regexrs-regular", "regex"]

