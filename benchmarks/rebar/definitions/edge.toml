analysis = '''
Small checked-in synthetic fixtures for semantic edges: empty matches at
UTF-8 boundaries, unmatched versus empty capture groups, and case folds with
different UTF-8 widths (KELVIN SIGN, LONG S). Correctness smoke, not a speed
comparison.
'''

[[bench]]
model = "count"
name = "empty-utf8-boundaries"
regex = ''
unicode = true
haystack = { path = "synthetic/unicode-mixed.txt" }
count = 14
engines = ["regexrs", "regexrs-regular", "regex", "fancy"]

[[bench]]
model = "count-captures"
name = "optional-groups"
regex = '(a)?(b*)'
unicode = true
haystack = { path = "synthetic/optional-groups.txt" }
count = 23
engines = ["regexrs", "regexrs-regular", "regexrs-searcher", "regex", "fancy"]

[[bench]]
model = "count-spans"
name = "case-folds"
regex = 'k+|s+'
unicode = true
case-insensitive = true
haystack = { path = "synthetic/case-folds.txt" }
count = 14
engines = ["regexrs", "regexrs-regular", "regex", "fancy"]
