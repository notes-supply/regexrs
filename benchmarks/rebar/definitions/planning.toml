analysis = '''
Construction, first search and warmed matching, kept apart. For each case,
`compile` times construction alone, `fresh-MODEL` the first run of MODEL on an
instance constructed outside the timed interval, `startup-MODEL` construction
plus that first run, both on a small store of about a hundred lines, and the
plain model warmed matching on the whole haystack with the same calls as the
other suites. Defaults and tuned configurations (regexrs-seek, fancy-seek) are
separate engines. regexrs-regular, regex and resharp only appear where their
semantics match. See docs/benchmarks.md.
'''

[[bench]]
model = "compile"
name = "titled-compile"
regex = '(?<=Mr\. |Dr\. )[A-Z]\w+'
unicode = true
haystack = { path = "rebar/sherlock.txt", line-start = 1200, line-end = 1300 }
count = 5
engines = ["regexrs", "regexrs-seek", "fancy", "fancy-seek", "resharp"]

[[bench]]
model = "fresh-count"
name = "titled-fresh-small"
regex = '(?<=Mr\. |Dr\. )[A-Z]\w+'
unicode = true
