min_version = "2026.10.3"

[tools]
rust = { version = "nightly-2026-10-11", components = "rustfmt,clippy,rust-src", targets = "wasm32-unknown-unknown", profile = "minimal" }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"

[tasks."fmt:check"]
run = "cargo fmt --all --check"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.lint]
run = "cargo clippy --all-targets --all-features --locked -- -D warnings"

[tasks.test]
run = "cargo nextest run --locked --all-features"
wait_for = ["lint"]

[tasks.doc]
run = "cargo test --locked --all-features --doc"
wait_for = ["test"]

[tasks.features]
run = ["cargo check --locked --no-default-features", "cargo check --locked --no-default-features --features unicode,perf,variable-lookbehinds"]
wait_for = ["doc"]

[tasks.check]
depends = ["fmt:check", "lint", "test", "doc", "features"]

[tasks.build]
run = "cargo build --locked --release"

[tasks.package]
run = "cargo package --locked --all-features"

[tasks.publish]
description = "Publish an already verified package; invoked by the release workflow"
run = "cargo publish --locked --all-features --no-verify --registry crates-io"

[tasks.bench]
description = "Parity-gated backreference comparison against Rust competitors"
run = "cargo run --locked --release --example competition --features native -- bench 1 1000000 7"

# Rebar benchmark suite (development only; see docs/benchmarks.md).

[tasks."bench:rebar:fetch"]
description = "Check out the pinned Rebar harness and corpora into benchmarks/.rebar"
dir = "{{config_root}}/benchmarks"
run = """
set -eu
rev=463d00f31887e84c38467805b9e3122c314b9521
[ -d .rebar/.git ] || git clone --quiet --no-checkout https://github.com/BurntSushi/rebar .rebar
git -C .rebar cat-file -e "$rev^{commit}" 2>/dev/null || git -C .rebar fetch --quiet origin
git -C .rebar checkout --quiet --detach "$rev"
test "$(git -C .rebar rev-parse HEAD)" = "$rev"
mkdir -p rebar/haystacks rebar/regexes
ln -sfn ../../.rebar/benchmarks/haystacks rebar/haystacks/rebar
ln -sfn ../../.rebar/benchmarks/regexes rebar/regexes/rebar
"""

[tasks."bench:rebar:build"]
description = "Build the pinned Rebar CLI and the runner"
depends = ["bench:rebar:fetch"]
dir = "{{config_root}}/benchmarks"
env = { CARGO_TARGET_DIR = "{{config_root}}/benchmarks/target" }
run = [
  "cargo build --locked --release --manifest-path .rebar/Cargo.toml",
  "cargo build --locked --release --features native --manifest-path runner/Cargo.toml",
]

[tasks."bench:rebar:verify"]
description = "Check spans, captures and counts of every row before timing"
depends = ["bench:rebar:build"]
dir = "{{config_root}}/benchmarks"
env = { CARGO_TARGET_DIR = "{{config_root}}/benchmarks/target" }
run = ["cargo test --locked --release --features native --manifest-path runner/Cargo.toml", "bash verify.sh"]

[tasks."bench:rebar:measure"]
description = "Measure every verified row into .benchmark-results/rebar"
depends = ["bench:rebar:verify"]
dir = "{{config_root}}/benchmarks"
run = """
set -eu
out="../.benchmark-results/rebar/$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short HEAD)"
mkdir -p "$out"
{ git rev-parse HEAD; git status --porcelain; rustc -V; uname -srm; } > "$out/source.txt"
target/release/rebar measure -d rebar > "$out/results.csv"
echo "$out/results.csv"
"""

[tasks."bench:rebar:revision"]
description = "Build this runner against another regexrs source, or verify such a build: build SOURCE LABEL | verify LABEL [FILTER]"
depends = ["bench:rebar:build"]
dir = "{{config_root}}/benchmarks"
run = "bash revision.sh"

[tasks."bench:rebar:smoke"]
description = "Short run that exercises the harness; not for performance claims"
depends = ["bench:rebar:verify"]
dir = "{{config_root}}/benchmarks"
run = "target/release/rebar measure -d rebar --max-time 50ms --max-warmup-time 10ms --max-iters 50 --max-warmup-iters 5"
